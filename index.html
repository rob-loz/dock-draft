<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dock Draft</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    /* Login Screen */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .login-card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { margin-bottom: 24px; font-weight: 800; font-size: 24px; }
    select, input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 16px; outline: none; }
    select:focus, input:focus { border-color: var(--accent); }
    button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }

    /* Draft Screen */
    #draft-screen { display: none; max-width: 1400px; margin: 0 auto; padding: 30px 20px; width: 100%; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    
    /* Title Fade Animation */
    #main-title { font-weight: 800; font-size: 28px; transition: opacity 0.5s ease-in-out; }
    
    /* On the Clock Banner */
    .active-pick-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--accent);
    }
    
    .active-team-text {
      font-weight: 800;
      font-size: 18px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timer { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 8px 16px; border-radius: 20px; font-weight: 600; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* 3-Column Grid Layout */
    .draft-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; }
    
    /* NEW: Uniform Column Header to keep lists perfectly aligned */
    .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; min-height: 34px; }
    .column-header h3 { margin-bottom: 0; }
    
    h3 { font-size: 18px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    ul { list-style: none; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-y: auto; max-height: 70vh; padding: 10px; }
    ul::-webkit-scrollbar { width: 8px; }
    ul::-webkit-scrollbar-track { background: transparent; }
    ul::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin-bottom: 8px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border); }
    li:hover { border-color: var(--accent); }

    /* Highlight the logged-in manager's picks */
    li.my-pick {
      border-color: var(--accent);
      border-left: 4px solid var(--accent);
      background: rgba(16, 185, 129, 0.08);
    }

    .player-info { display: flex; flex-direction: column; }
    .player-name { font-weight: 600; font-size: 16px; }
    .player-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    
    /* Position Colors */
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; margin-right: 6px; }
    .badge.QB { background: #ef4444; color: white; }
    .badge.RB { background: #3b82f6; color: white; }
    .badge.WR { background: #10b981; color: white; }
    .badge.TE { background: #f59e0b; color: white; }
    .badge.K { background: #8b5cf6; color: white; }
    .badge.DEF { background: #64748b; color: white; }

    .btn-draft { width: auto; padding: 8px 16px; font-size: 14px; }
    .btn-disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    .btn-disabled:hover { background: var(--border); }

    /* AI Toast */
    #sassy-toast { display: none; position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid var(--accent); color: var(--text-main); padding: 20px 30px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(16, 185, 129, 0.2); z-index: 1000; text-align: center; font-weight: 600; font-size: 18px; opacity: 0; transition: all 0.4s ease; }
    #sassy-toast.toast-active { display: block; transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 900px) { 
      .draft-container { grid-template-columns: 1fr; } 
      .header { flex-direction: column; gap: 15px; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <h2>War Room Access</h2>
      <select id="team-select"><option value="">Loading teams...</option></select>
      <input type="password" id="pin-input" placeholder="Enter 4-Digit PIN" maxlength="4">
      <button onclick="login()">Enter Draft</button>
    </div>
  </div>

  <!-- MAIN DRAFT BOARD -->
  <div id="draft-screen">
    
    <div id="sassy-toast"></div>

    <div class="header">
      <h2 id="main-title">Its draft time dickheads</h2>
      
      <!-- Right Side Controls -->
      <div style="display: flex; gap: 15px; align-items: center;">
        
        <!-- On The Clock Banner -->
        <div class="active-pick-container">
          <span class="active-team-text" id="current-pick-team">Loading...</span>
          <div class="timer" id="clock-display">24:00:00</div> 
        </div>

        <!-- Log Out Button -->
        <button onclick="logout()" style="width: auto; padding: 10px 16px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 14px;">Log Out</button>

      </div>
    </div>

    <div class="draft-container">
      
      <!-- Column 1: Available Players -->
      <div id="available-players">
        <div class="column-header">
          <h3>Available Players</h3>
        </div>
        <ul id="players-list"></ul>
      </div>

      <!-- Column 2: The Draft Board -->
      <div id="draft-board">
        <div class="column-header">
          <h3>Live Draft Board</h3>
        </div>
        <ul id="board-list"></ul>
      </div>

      <!-- Column 3: Team Rosters -->
      <div id="team-rosters">
        <div class="column-header">
          <h3>Rosters</h3>
          <select id="roster-select" onchange="viewSelectedRoster()" style="width: 160px; padding: 6px; font-size: 14px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px;"></select>
        </div>
        <ul id="roster-list"></ul>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
